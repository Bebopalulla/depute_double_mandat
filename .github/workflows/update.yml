
name: Mise à jour double mandats

on:
  schedule:
    - cron: "0 6 10 * *"   # Le 10 de chaque mois à 6h UTC
  workflow_dispatch:         # Déclenchement manuel possible

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installation des dépendances
        run: pip install pandas requests

      - name: Exécution du script
        run: python scripts/build_csv.py

      - name: Commit et push du CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/depute_double_mandats.csv
          git diff --cached --quiet || git commit -m "Mise à jour double mandats — $(date +'%Y-%m-%d')"
          git push
